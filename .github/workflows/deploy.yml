# main への push で Firebase（Hosting + SSR Functions + Firestore/Storage ルール）へデプロイする。
# GCP への認証は Workload Identity Federation を使い、サービスアカウントキーは保存しない。
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイが重ならないよう 1 本ずつ実行する（途中キャンセルはしない）
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v7
        with:
          # npm ci で依存のスクリプトが動くので、GitHub のトークンを .git に残さない
          persist-credentials: false

      # SSR 用 Cloud Functions のランタイムは portfolio/package.json の engines.node で決まる（Node 20 は 2026-10-30 に提供終了）。
      # ビルドも同じ版で行うよう、ここでも engines.node を読む（版を書く場所を1つにするため）
      - uses: actions/setup-node@v7
        with:
          node-version-file: portfolio/package.json
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - run: npm ci

      # .env.local は next build 用、.env.portfoliosite-b12da は Functions のランタイム環境変数用
      - name: Write env files
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
          ENV_FUNCTIONS: ${{ secrets.ENV_FUNCTIONS }}
        run: |
          printf '%s\n' "$ENV_LOCAL" > .env.local
          printf '%s\n' "$ENV_FUNCTIONS" > .env.portfoliosite-b12da

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy
        run: npx --yes firebase-tools@15.28.1 deploy --project portfoliosite-b12da --non-interactive --force
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
