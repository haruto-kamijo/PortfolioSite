# main への push で Firebase（App Hosting + Hosting の転送 + Firestore/Storage ルール）へデプロイする。
# kamijoharuto.com は App Hosting（backend: portfolio）が配る。App Hosting は portfolio/apphosting.yaml の設定で
# Firebase 側がビルドする（秘密の値は Cloud Secret Manager から読む）ので、ここではビルドも npm ci もしない。
# Hosting（portfoliosite-b12da.web.app・firebaseapp.com）は、すべてのパスを kamijoharuto.com へ転送するだけ（firebase.json）。
# GCP への認証は Workload Identity Federation を使い、サービスアカウントキーは保存しない。
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイが重ならないよう 1 本ずつ実行する（途中キャンセルはしない）
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # firebase-tools を動かすためだけに使う。App Hosting の実行環境の Node は engines.node で決まる
      - uses: actions/setup-node@v7
        with:
          node-version-file: portfolio/package.json

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # App Hosting のデプロイの不具合（15.28.2 で修正。デプロイする SA に compute SA を作る権限が無いと失敗する）を避けるため、15.28.2 以上にする
      - name: Deploy
        run: npx --yes firebase-tools@15.36.0 deploy --project portfoliosite-b12da --non-interactive --force
