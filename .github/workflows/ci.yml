# 共通 CI を呼び出す。判定と実行内容は haruto-kamijo/ci-workflows 側で管理している
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: haruto-kamijo/ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # 手動実行のときは、変更ファイルに関係なくすべてのチェックを走らせる
      run-all: ${{ github.event_name == 'workflow_dispatch' }}
      # ビルドは e2e.yml で行う（秘密の値なしでビルドし、画面のテストまで動かす）。portfolio/ に触れない PR ではビルドしない
      run-build: false
      # 共通 CI の既定は Node 20。portfolio/package.json の engines.node（Cloud Functions のランタイム）と合わせる。
      # 20 のままだと、Node 22 以上を求める任意の依存（firebase-admin 14 の @google-cloud/firestore）が入らず、型が欠ける。
      # engines.node を上げるときは、ここも上げる
      node-version: "22"
