# 画面の動きを確かめる E2E テスト（portfolio/e2e）。
# Firebase の秘密の値は使わない。値が無いときサイトは静的な既定値で表示されるので、それをビルドして確かめる
name: E2E

on:
  pull_request:
    paths:
      - "portfolio/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      # 本番（deploy.yml）と同じく engines.node の版で動かす
      - uses: actions/setup-node@v4
        with:
          node-version-file: portfolio/package.json
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - run: npm ci

      # ブラウザは Playwright の版ごとにキャッシュする
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run build
      - run: npm run test:e2e

      # 落ちたときは、どこで何が起きたかを見られるように報告とトレースを残す
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            portfolio/playwright-report
            portfolio/test-results
          retention-days: 7
