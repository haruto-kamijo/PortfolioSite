# 依存パッケージと GitHub Actions の更新を、毎週 PR で知らせる。
# マージは本人が行う（PR には CodeRabbit のレビューと CI・E2E が付く）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /portfolio
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # 公開された直後の版は、数日おいてから出す（取り下げや乗っ取られた版を避ける）
    cooldown:
      default-days: 3
    commit-message:
      prefix: "[chore]"
    # 小さな更新（minor・patch）は1つの PR にまとめる。
    # three は 0.x で、minor でも作りが変わり @react-three/* と合わなくなることがあるので、まとめずに別の PR にする
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["three", "@types/three"]
    # 土台のフレームワークのメジャー更新は、作り直しを伴うので自動では出さない。
    # サポート期限は lifecycle.yml が毎週確かめて、切れそうなら Issue で知らせる
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "@react-three/*"
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # 型は engines.node の Node と合わせて、engines を上げるときに手で上げる
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 は Next 14 が使う Compiler API を持たず、ビルドが止まる。Next を上げるときに合わせて上げる
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # firebase-tools はデプロイのときに firebase-frameworks を足す。その peer が firebase ^12・firebase-admin ^13 までなので、
      # それより上のメジャーにするとデプロイの npm install が ERESOLVE で止まる（CI では分からない）。
      # firebase-frameworks が新しいメジャーに対応したら外す（npm view firebase-frameworks peerDependencies で確かめる）
      - dependency-name: firebase
        update-types: [version-update:semver-major]
      - dependency-name: firebase-admin
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "[chore]"
    groups:
      actions:
        patterns: ["*"]
